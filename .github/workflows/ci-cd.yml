name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'anul-iii/analiza-si-proiectarea-sistemelor-informatice/nextjs/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'anul-iii/analiza-si-proiectarea-sistemelor-informatice/nextjs/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  PROJECT_DIR: anul-iii/analiza-si-proiectarea-sistemelor-informatice/nextjs
  NODE_VERSION: '20'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ github.server_url }}/${{ github.repository }}/tree/main/${{ env.PROJECT_DIR }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ro
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-demo-secret' }}
          # Enable static export for GitHub Pages
          NEXT_OUTPUT: export

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/out/

  # ──────────────────────────────────────────────
  # 2. Deploy to GitHub Pages
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
